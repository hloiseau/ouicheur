# Stable project name for upgrades from Wishlister, even if the checkout is renamed.
name: wishlister
services:
  app:
    build: .
    image: ouicheur:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATA_DIR: /app/data
      TRUST_PROXY: ${TRUST_PROXY:-0}
      NEXT_TELEMETRY_DISABLED: "1"
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - wishlister-data:/app/data
      - wishlister-backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
# Keep legacy volume keys so existing installations retain their data.
volumes:
  wishlister-data:
  wishlister-backups:

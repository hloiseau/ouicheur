ouicheur:
  app_origin: https://wishlist.example.org
  trust_proxy: false
run_as:
  user: 568
  group: 568
network:
  web_port:
    bind_mode: published
    port_number: 31001
    host_ips:
      - 192.0.2.10
resources:
  limits:
    cpus: 2
    memory: 2048
storage:
  data:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/data
      create_host_path: true
      auto_permissions: false
  backups:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/backups
      create_host_path: true
      auto_permissions: false

{% set tpl = ix_lib.base.render.Render(values) %}
{% set app = tpl.add_container(values.consts.app_container_name, "image") %}
{% set permissions = tpl.deps.perms(values.consts.perms_container_name) %}

{% do app.set_user(values.run_as.user, values.run_as.group) %}
{% do app.healthcheck.use_built_in() %}
{% do app.environment.add_env("APP_ORIGIN", values.ouicheur.app_origin) %}
{% do app.environment.add_env("TRUST_PROXY", "1" if values.ouicheur.trust_proxy else "0") %}
{% do app.environment.add_env("DATA_DIR", "/app/data") %}
{% do app.environment.add_env("NEXT_TELEMETRY_DISABLED", "1") %}
{% do app.add_port(values.network.web_port, {"container_port": 3000}) %}

{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% do app.add_storage("/app/data", values.storage.data) %}
{% do app.add_storage("/app/backups", values.storage.backups) %}
{% do permissions.add_or_skip_action("data", values.storage.data, perms_config) %}
{% do permissions.add_or_skip_action("backups", values.storage.backups, perms_config) %}
{% if permissions.has_actions() %}
  {% do permissions.activate() %}
  {% do app.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{{ tpl.render() | tojson }}

groups:
  - name: Ouicheur Configuration
    description: Ouicheur Configuration
  - name: User and Group Configuration
    description: User and Group Configuration
  - name: Network Configuration
    description: Network Configuration
  - name: Storage Configuration
    description: Storage Configuration
  - name: Resources Configuration
    description: Resources Configuration
questions:
  - variable: ouicheur
    label: ""
    group: Ouicheur Configuration
    schema:
      type: dict
      attrs:
        - variable: app_origin
          label: Public origin (optional for direct LAN access)
          schema:
            type: string
            default: ""
          description:
            For an HTTPS reverse proxy, enter its exact origin without a path.
            Leave empty for direct LAN access.
        - variable: trust_proxy
          label: Trust forwarded client IP
          schema:
            type: boolean
            default: false
          description:
            Enable only when the trusted reverse proxy replaces X-Forwarded-For
            and direct access is blocked.
  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          schema:
            type: int
            default: 1000
            min: 1
            required: true
        - variable: group
          label: Group ID
          schema:
            type: int
            default: 1000
            min: 1
            required: true
  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web UI port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port bind mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish on the NAS
                    - value: exposed
                      description: Expose to containers only
                    - value: ""
                      description: Do not publish
              - variable: port_number
                label: Host port
                schema:
                  type: int
                  default: 31000
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  default: []
                  show_if:
                    - - bind_mode
                      - "="
                      - published
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Database and images
          schema:
            type: dict
            attrs:
              - variable: type
                label: Storage type
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  enum:
                    - value: ix_volume
                      description: Create an application dataset
                    - value: host_path
                      description: Use an existing local path
              - variable: ix_volume_config
                label: Dataset
                schema:
                  type: dict
                  show_if:
                    - - type
                      - "="
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset name
                      schema:
                        type: string
                        default: data
                        required: true
                        hidden: true
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl_entries
                      label: ACL entries
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - "="
                            - true
                        attrs: []
              - variable: host_path_config
                label: Existing local path
                schema:
                  type: dict
                  show_if:
                    - - type
                      - "="
                      - host_path
                  attrs:
                    - variable: path
                      label: Path (must be writable by selected UID/GID)
                      schema:
                        type: hostpath
                        required: true
        - variable: backups
          label: Application backups
          schema:
            type: dict
            attrs:
              - variable: type
                label: Storage type
                schema:
                  type: string
                  default: ix_volume
                  required: true
                  enum:
                    - value: ix_volume
                      description: Create an application dataset
                    - value: host_path
                      description: Use an existing local path
              - variable: ix_volume_config
                label: Dataset
                schema:
                  type: dict
                  show_if:
                    - - type
                      - "="
                      - ix_volume
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: dataset_name
                      label: Dataset name
                      schema:
                        type: string
                        default: backups
                        required: true
                        hidden: true
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl_entries
                      label: ACL entries
                      schema:
                        type: dict
                        show_if:
                          - - acl_enable
                            - "="
                            - true
                        attrs: []
              - variable: host_path_config
                label: Existing local path
                schema:
                  type: dict
                  show_if:
                    - - type
                      - "="
                      - host_path
                  attrs:
                    - variable: path
                      label: Path (must be writable by selected UID/GID)
                      schema:
                        type: hostpath
                        required: true
  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  default: 2
                  min: 1
                  required: true
              - variable: memory
                label: Memory (MiB)
                schema:
                  type: int
                  default: 2048
                  min: 512
                  required: true

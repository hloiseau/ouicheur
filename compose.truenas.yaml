# Modèle pour TrueNAS 25.10 > Apps > Discover Apps > Install via YAML.
# Remplacer l’image, l’adresse du NAS et les deux chemins de datasets.
# registry.example.org est un exemple : aucune image n’y est publiée.
services:
  wishlister:
    image: registry.example.org/wishlister:1.0.0
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "31000:3000"
    environment:
      APP_ORIGIN: http://192.168.1.20:31000
      DATA_DIR: /app/data
      TRUST_PROXY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - type: bind
        source: /mnt/tank/apps/wishlister/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/apps/wishlister/backups
        target: /app/backups
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

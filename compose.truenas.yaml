# Modèle pour les Apps Docker de TrueNAS 25.04 / 25.10 > Install via YAML.
# Remplacer APP_ORIGIN par l'adresse du NAS ou le domaine HTTPS public.
services:
  ouicheur:
    image: ghcr.io/hloiseau/ouicheur:main
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "31000:3000"
    environment:
      APP_ORIGIN: http://localhost:31000
      DATA_DIR: /app/data
      TRUST_PROXY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ouicheur-data:/app/data
      - ouicheur-backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ouicheur-data:
  ouicheur-backups:

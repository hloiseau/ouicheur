# Modèle pour les Apps Docker de TrueNAS 25.04 / 25.10 > Install via YAML.
# Première installation ; les mises à jour automatiques utilisent un digest testé.
services:
  ouicheur:
    image: ghcr.io/hloiseau/ouicheur:main
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "31000:3000"
    environment:
      APP_ORIGIN: https://ouicheur.hugoloiseau.fr
      DATA_DIR: /app/data
      TRUST_PROXY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - type: bind
        source: /mnt/Main/tank/ouicheur/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Main/tank/ouicheur/backups
        target: /app/backups
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

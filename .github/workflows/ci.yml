name: Test and publish Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ouicheur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-fund
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Release tag must be v followed by package.json version");
            }
          '
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:fetch-browser
      - run: npm run build
      - run: npm run test:e2e
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ouicheur:local
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: npm run test:docker
      - name: Measure image footprint
        run: |
          docker image inspect ouicheur:local --format '{{.Size}}' > image-size-${{ matrix.arch }}.txt
          cat image-size-${{ matrix.arch }}.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.arch }}" = amd64 ]; then
            previous="ghcr.io/hloiseau/ouicheur@sha256:9915f152b0c53f8c41f68bf1aafd6375d0f17d6eb0e721e4a6720842bde93825"
            docker pull "$previous"
            docker image inspect "$previous" --format '{{.Size}}' > image-size-baseline-amd64.txt
          fi
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested architecture
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag ouicheur:local "$image:sha-$REVISION-$ARCH"
          docker push "$image:sha-$REVISION-$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: product-screenshots-${{ matrix.arch }}
          path: |
            test-results/*.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            image-size-*.txt
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-test-results-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
            image-size-*.txt
          retention-days: 7

  # Branch protection requires this exact name; matrix checks have suffixes.
  verify-required:
    name: verify
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both architectures to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "Architecture verification did not succeed: $VERIFY_RESULT" >&2
            exit 1
          fi

  publish-manifest:
    needs: verify-required
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both tested architectures under the release tags
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          release="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then release=main; fi
          docker buildx imagetools create --tag "$image:sha-$REVISION" --tag "$image:$release" "$image:sha-$REVISION-amd64" "$image:sha-$REVISION-arm64"

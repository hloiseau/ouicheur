name: Test and publish Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ouicheur-${{ github.ref }}
  # Superseded PR commits cannot be merged or released. Keep main/tag
  # publication runs serialized and complete, but validate only the latest PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres:
    name: PostgreSQL catalog contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ouicheur_test_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-fund
      - run: npm run test:postgres
        env:
          POSTGRES_TEST_URL: postgresql://postgres:test-only-postgres-password@127.0.0.1:5432/ouicheur_test_catalog
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/pw-browsers
      NEXT_PUBLIC_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-fund
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Release tag must be v followed by package.json version");
            }
          '
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:fetch-browser
      - run: npm run build
      - run: npm run test:e2e
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ouicheur:local
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: npm run test:docker
      - name: Export the tested image inventories and notices
        run: |
          container=$(docker create ouicheur:local)
          mkdir -p release-inventory-${{ matrix.arch }}
          docker cp "$container:/app/third-party-licenses/." release-inventory-${{ matrix.arch }}/
          docker rm "$container"
          docker image inspect ouicheur:local --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Size}}' > release-inventory-${{ matrix.arch }}/image.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inventory-${{ matrix.arch }}
          path: release-inventory-${{ matrix.arch }}/
          retention-days: 30
      - name: Measure image footprint
        run: |
          docker image inspect ouicheur:local --format '{{.Size}}' > image-size-${{ matrix.arch }}.txt
          cat image-size-${{ matrix.arch }}.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.arch }}" = amd64 ]; then
            previous="ghcr.io/hloiseau/ouicheur@sha256:9915f152b0c53f8c41f68bf1aafd6375d0f17d6eb0e721e4a6720842bde93825"
            docker pull "$previous"
            docker image inspect "$previous" --format '{{.Size}}' > image-size-baseline-amd64.txt
          fi
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested architecture
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag ouicheur:local "$image:sha-$REVISION-$ARCH"
          docker push "$image:sha-$REVISION-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: product-screenshots-${{ matrix.arch }}
          path: |
            test-results/*.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            image-size-*.txt
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: feature-review-${{ matrix.arch }}
          path: |
            test-results/**/error-context.md
            test-results/list-*.png
            test-results/bookmark-*.png
            test-results/calendar-*.png
            test-results/notification-*.png
            test-results/price-*.png
            test-results/donor-*.png
            test-results/received-*.png
            test-results/template-*.png
            test-results/exchange-*.png
            test-results/pagination-*.png
            test-results/support-*.png
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-test-results-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
            image-size-*.txt
          retention-days: 7

  # Branch protection requires this exact name; matrix checks have suffixes.
  verify-required:
    name: verify
    needs: [verify, postgres]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both architectures to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$POSTGRES_RESULT" != "success" ]; then
            echo "Required verification did not succeed: architectures=$VERIFY_RESULT postgres=$POSTGRES_RESULT" >&2
            exit 1
          fi

  publish-manifest:
    needs: verify-required
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both tested architectures under the release tags
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          release="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then release=main; fi
          if [ "$release" != main ]; then
            RELEASE="$release" node --input-type=module <<'JS'
          const repository = process.env.REPOSITORY.toLowerCase();
          const scope = new URLSearchParams({ service: "ghcr.io", scope: `repository:${repository}:pull` });
          const auth = await fetch(`https://ghcr.io/token?${scope}`, { signal: AbortSignal.timeout(15000) });
          if (!auth.ok) throw new Error(`Cannot check existing releases: registry authentication returned ${auth.status}`);
          const { token } = await auth.json();
          if (!token) throw new Error("Registry did not return a read token");
          const response = await fetch(`https://ghcr.io/v2/${repository}/manifests/${encodeURIComponent(process.env.RELEASE)}`, {
            method: "HEAD",
            headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" },
            signal: AbortSignal.timeout(15000),
          });
          if (response.status === 200) throw new Error("Numbered release already exists. Publish a new version.");
          if (response.status !== 404) throw new Error(`Cannot prove this release is absent: registry returned ${response.status}`);
          console.log("Numbered release does not yet exist; publication may proceed.");
          JS
          fi
          docker buildx imagetools create --tag "$image:sha-$REVISION" --tag "$image:$release" "$image:sha-$REVISION-amd64" "$image:sha-$REVISION-arm64"

  publish-release:
    needs: [verify-required, publish-manifest]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ouicheur-stable-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the requested stable release from tested images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs

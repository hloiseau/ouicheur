name: Visual UI audit
on:
  push:
    branches: [diagnostics/ui-audit-20261002]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run build
      - run: UI_AUDIT=1 npm run test:e2e -- tests/e2e/ui-audit.spec.ts tests/e2e/ui-finishing.spec.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: visual-ui-audit
          path: test-results/
          retention-days: 7

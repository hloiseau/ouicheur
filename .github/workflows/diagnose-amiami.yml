name: One-off public AmiAmi diagnostic
on:
  push:
    branches: [diagnostics/amiami-20261002]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node --import tsx scripts/diagnose-amiami.ts

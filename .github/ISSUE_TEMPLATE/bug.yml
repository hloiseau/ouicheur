name: Bug / Problème
description: Décrire un problème reproductible avec des données fictives.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Une vulnérabilité ? Suivre SECURITY.md. Ne publiez ni secrets, ni liens privés, ni sauvegardes. / Security issue? Follow SECURITY.md."
  - type: textarea
    id: technical
    attributes:
      label: Version et informations techniques / Version and technical details
      description: Copier l’aperçu de Mon instance → Signaler un problème, ou indiquer version et commit.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement / Environment
      placeholder: TrueNAS 25.04, Unraid + version, Docker / navigateur + version / téléphone
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes, résultat attendu et résultat observé / Steps, expected and actual result
      description: Un petit exemple reproductible suffit. / A minimal example is enough.
    validations:
      required: true
  - type: input
    id: merchant
    attributes:
      label: Lien marchand public facultatif / Optional public shop URL
      description: Seulement si nécessaire et si vous souhaitez le rendre public.
  - type: textarea
    id: evidence
    attributes:
      label: Capture ou extrait utile / Screenshot or relevant log excerpt
      description: Masquer les données personnelles. / Remove private data.
